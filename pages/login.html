<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEE Mock Test Starting Soon | Sankalpa Classes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/x-icon" href="../assets/icon.ico">
</head>
<body>

    <!-- Animated Background Elements -->
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>

    <main class="timer-container">
        <div class="timer-card glass-panel">
            
            <header class="card-header">
                <!-- Placeholder for the CEE Scholars Logo -->
                <div class="logo-wrapper">
                    <img src="../assets/cee-scholars-logo.png" alt="CEE Scholars" class="brand-logo" onerror="this.style.display='none'">
                    <h1 class="brand-title">Sankalpa Classes</h1>
                </div>
                
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span>Upcoming Exam</span>
                </div>
                
                <h2 class="form-title" id="statusTitle">CEE Online Mock Test Starts In</h2>
                <p class="form-subtitle">Ensure your internet connection is stable. The portal will open automatically.</p>
            </header>

            <!-- Premium Countdown Display -->
            <div id="countdown" class="countdown-wrapper">
                <div class="time-block">
                    <div class="time-value glass-inset" id="hours">00</div>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <div class="time-value glass-inset" id="minutes">00</div>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-separator">:</div>
                <div class="time-block">
                    <div class="time-value glass-inset" id="seconds">00</div>
                    <span class="time-label">Seconds</span>
                </div>
            </div>
            
            <!-- Action Area (Revealed when timer hits 0) -->
            <div class="action-area">
                <button id="refreshBtn" class="submit-btn hidden" onclick="window.location.reload()">
                    <span class="btn-text">Enter Exam Portal</span>
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="btn-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </div>

            <footer class="card-footer">
                <p>Scheduled for Tomorrow @ 1:00 PM NPT</p>
            </footer>
        </div>
    </main>

    <script type="module" src="../js/login.js"></script>
</body>
</html>
